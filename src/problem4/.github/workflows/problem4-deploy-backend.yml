name: Problem 4 reusable backend deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy backend (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: artifact
      - name: Verify release and protected environment before requesting AWS identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tasks/problem4/scripts/package.py verify backend artifact
          python3 tasks/problem4/scripts/release-gate.py
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy and verify, or restore previous revision
        run: python3 tasks/problem4/scripts/deploy-backend.py artifact
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-record-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-record.json
          if-no-files-found: warn
          retention-days: 90
