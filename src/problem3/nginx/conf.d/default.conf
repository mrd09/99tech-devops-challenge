map $uri $endpoint {
    default other;
    ~^/api/users/?$ /api/users;
    /status /status;
    /livez /livez;
    / /;
}

log_format api_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","endpoint":"$endpoint",'
    '"status":$status,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    access_log /dev/stdout api_json;
    error_log /dev/stderr warn;
    add_header X-Request-ID $request_id always;

    # Docker's embedded DNS: re-resolve api after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;
    set $api_upstream api:3000;
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;

    location = / {
        default_type text/plain;
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass http://$api_upstream;
    }

    location = /status {
        proxy_pass http://$api_upstream;
    }

    location = /livez {
        proxy_pass http://$api_upstream;
    }
}
