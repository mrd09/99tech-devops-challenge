x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.25
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: ./api
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    logging: *bounded-logging
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_NAME: postgres
      # Supplied challenge credentials, for this local fixture only.
      DB_PASSWORD: postgres
      DB_POOL_MAX: "10"
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
